<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>228之子桌小二 ·</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #c2e9fb 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
            padding: 20px;
        }
        .bg-bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(57, 197, 187, 0.15);
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }
        .bg-bubble:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 8%; animation-delay: 0s; }
        .bg-bubble:nth-child(2) { width: 80px; height: 80px; top: 70%; left: 15%; animation-delay: 2s; background: rgba(255, 182, 193, 0.25); }
        .bg-bubble:nth-child(3) { width: 160px; height: 160px; top: 20%; right: 10%; animation-delay: 4s; background: rgba(135, 206, 235, 0.2); }
        .bg-bubble:nth-child(4) { width: 60px; height: 60px; bottom: 12%; right: 18%; animation-delay: 1s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        .card {
            position: relative;
            z-index: 1;
            width: min(620px, 94vw);
            max-height: 94vh;
            overflow-y: auto;
            padding: 40px 36px 32px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(44, 62, 80, 0.15), 0 6px 20px rgba(57, 197, 187, 0.2);
            text-align: center;
            animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .avatar-wrap {
            width: 110px;
            height: 110px;
            margin: 0 auto 18px;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(from 0deg, #39c5bb, #ff9a9e, #a8edea, #39c5bb);
            animation: spin 6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #e0fbf6, #ffe4ec);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            animation: spin 6s linear infinite reverse;
        }
        .avatar svg { width: 88%; height: 88%; display: block; }
        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #2c3e50, #39c5bb, #2c3e50);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            margin-bottom: 8px;
        }
        @keyframes shine { to { background-position: 200% center; } }
        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 26px;
            letter-spacing: 2px;
        }
        .subtitle span { display: inline-block; animation: wave 2s ease-in-out infinite; }
        .subtitle span:nth-child(2) { animation-delay: 0.15s; }
        .subtitle span:nth-child(3) { animation-delay: 0.3s; }
        .subtitle span:nth-child(4) { animation-delay: 0.45s; }
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .form-input, .form-textarea {
            width: 100%;
            font-size: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(44, 62, 80, 0.15);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.75);
            color: #2c3e50;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .form-input:focus, .form-textarea:focus {
            border-color: #39c5bb;
            box-shadow: 0 0 0 3px rgba(57, 197, 187, 0.15);
        }
        .form-textarea { resize: vertical; min-height: 88px; line-height: 1.5; }
        .dropzone {
            border: 2px dashed rgba(57, 197, 187, 0.5);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.5);
            transition: border-color 0.2s, background 0.2s;
            font-size: 13px;
            color: #7f8c8d;
            line-height: 1.6;
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: #39c5bb;
            background: rgba(57, 197, 187, 0.1);
        }
        .dropzone .dz-icon { font-size: 26px; display: block; margin-bottom: 4px; }
        .dropzone .dz-types { font-size: 12px; color: #95a5a6; margin-top: 4px; display: block; }
        .file-list { margin-top: 10px; }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(57, 197, 187, 0.12);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 6px;
            font-size: 13px;
            color: #2c3e50;
        }
        .file-item small { color: #95a5a6; margin-left: 4px; }
        .file-item .rm { cursor: pointer; color: #e74c3c; font-weight: bold; padding: 0 4px; }
        .btn-row { display: flex; gap: 12px; margin: 4px 0 18px; }
        .btn {
            position: relative;
            flex: 1;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(135deg, #39c5bb, #2c3e50);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(57, 197, 187, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.2s;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(57, 197, 187, 0.55); }
        .btn:active { transform: translateY(-1px) scale(0.97); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: 0 4px 12px rgba(57, 197, 187, 0.3); }
        .btn::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }
        .btn:active::before { width: 300px; height: 300px; }
        .btn-ghost {
            background: transparent;
            color: #39c5bb;
            border: 1px solid rgba(57, 197, 187, 0.5);
            box-shadow: none;
            flex: none;
            padding: 8px 22px;
            font-size: 13px;
            margin-top: 8px;
        }
        .btn-ghost:hover { background: rgba(57, 197, 187, 0.1); box-shadow: none; transform: none; }
        .result {
            text-align: left;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(44, 62, 80, 0.1);
            border-radius: 14px;
            padding: 16px;
            min-height: 56px;
            font-size: 15px;
            color: #2c3e50;
            max-height: 360px;
            overflow: auto;
            line-height: 1.6;
        }
        .result:empty::before { content: "结果将展示在这里…"; color: #b0b8c1; }
        .result table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 14px; }
        .result th, .result td { border: 1px solid #2c3e50; padding: 8px 12px; text-align: left; }
        .result th { background: #39c5bb; color: #fff; font-weight: 600; }
        .result tr:nth-child(even) td { background: rgba(57, 197, 187, 0.07); }
        .result h1, .result h2, .result h3 { margin: 14px 0 8px; color: #2c3e50; }
        .result h2 { font-size: 18px; border-bottom: 2px solid #39c5bb; padding-bottom: 4px; }
        .result h3 { font-size: 16px; }
        .result p { margin: 6px 0; }
        .result ul, .result ol { margin: 6px 0 6px 22px; }
        .result li { margin: 4px 0; }
        .result code { background: rgba(44, 62, 80, 0.08); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
        .result blockquote {
            border-left: 4px solid #39c5bb;
            background: rgba(57, 197, 187, 0.08);
            padding: 8px 12px;
            margin: 10px 0;
            color: #555;
            border-radius: 0 8px 8px 0;
        }
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            padding: 14px 28px;
            background: linear-gradient(135deg, #2c3e50, #39c5bb);
            color: #fff;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.3);
            z-index: 99;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 90vw;
            text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        @media (max-width: 520px) {
            .card { padding: 28px 18px 24px; border-radius: 22px; }
            .btn-row { flex-direction: column; }
            h1 { font-size: 22px; }
            .subtitle { font-size: 12px; letter-spacing: 1px; }
            .form-input, .form-textarea { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="bg-bubble"></div>
    <div class="bg-bubble"></div>
    <div class="bg-bubble"></div>
    <div class="bg-bubble"></div>

    <div class="card">
        <div class="avatar-wrap">
            <div class="avatar">
             <img src="images/miku.jpg" alt="图片"
                style="
                width:100%;
                height:100%;
                border-radius:50%;
                object-fit:cover;
                object-position:center 20%;
">  
            </div>
        </div>
        <h1>无恶不作桌小二</h1>
        <p class="subtitle"><span>桌</span><span>小</span><span>二</span>  你的任务整理助手</p>

        <div class="form-group">
            <label class="form-label">文件上传（支持拖拽，可多选）</label>
            <div class="dropzone" id="dropzone">
                <span class="dz-icon">📁</span>
                点击或拖拽文件到此处
                <span class="dz-types">支持 pdf / doc / docx / txt / xls / xlsx</span>
                <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.txt,.xls,.xlsx" style="display:none">
            </div>
            <div class="file-list" id="fileList"></div>
        </div>

        <div class="form-group">
            <label class="form-label">项目编号</label>
            <input type="text" class="form-input" id="projectId" placeholder="例如：PRJ-2026-001">
        </div>

        <div class="form-group">
            <label class="form-label">用户提问</label>
            <textarea class="form-textarea" id="question" placeholder="请输入你的问题，例如：该项目当前进度如何？"></textarea>
        </div>

        <div class="btn-row">
            <button class="btn" id="uploadBtn">上传文件</button>
            <button class="btn" id="chatBtn">发送提问</button>
        </div>

        <div class="form-group">
            <label class="form-label">结果展示</label>
            <div class="result" id="result"></div>
        </div>

        <button class="btn btn-ghost" onclick="playVideo()">点下试试</button>

        <!-- 本地视频播放器：点击"点下试试"后显示并播放（带声音/音乐），视频文件放项目 video/ 目录，src 文件名改成你的真实文件名 -->
        <div id="videoOverlay" style="display:none;position:fixed;inset:0;width:100vw;height:100vh;background:#000;z-index:999;align-items:center;justify-content:center;">
            <video id="demoVideo" src="video/demo.mp4" controls preload="metadata" style="width:100vw;height:100vh;object-fit:contain;background:#000;"></video>
            <span onclick="closeVideo()" style="position:fixed;top:16px;right:22px;color:#fff;font-size:30px;line-height:1;cursor:pointer;z-index:1000;text-shadow:0 2px 6px rgba(0,0,0,.5);">&#10005;</span>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function playVideo(){
            const overlay = document.getElementById('videoOverlay');
            const v = document.getElementById('demoVideo');
            overlay.style.display = 'flex';   // 先显示覆盖层兜底
            v.currentTime = 0;
            v.play();                        // 播放（用户点击触发，可带声音/音乐）
            // 进入浏览器原生全屏（隐藏地址栏/工具栏，更沉浸）
            if (v.requestFullscreen) { v.requestFullscreen(); }
            else if (v.webkitRequestFullscreen) { v.webkitRequestFullscreen(); }
            else if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); }
        }
        function closeVideo(){
            const v = document.getElementById('demoVideo');
            const overlay = document.getElementById('videoOverlay');
            // 若仍在浏览器全屏，先退出全屏
            if (document.fullscreenElement) {
                (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
            }
            v.pause();
            v.currentTime = 0;
            overlay.style.display = 'none';
        }
        // 退出浏览器全屏（ESC / 视频全屏退出按钮）时自动关闭覆盖层
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) closeVideo();
        });
        document.addEventListener('webkitfullscreenchange', () => {
            if (!document.webkitFullscreenElement) closeVideo();
        });
        // 按 ESC 也能关闭全屏视频
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeVideo();
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        const parseMd = (md) => {
            if (!window.marked) return md;
            return marked.parse ? marked.parse(md) : marked(md);
        };
        if (window.marked) {
            marked.setOptions({ gfm: true, breaks: true });
        }

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        let selectedFiles = [];
        const ACCEPT_RE = /\.(pdf|doc|docx|txt|xls|xlsx)$/i;

        function renderFileList() {
            fileList.innerHTML = '';
            selectedFiles.forEach((f, i) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                const size = (f.size / 1024).toFixed(1) + 'KB';
                item.innerHTML = '<span>📄 ' + f.name + ' <small>(' + size + ')</small></span><span class="rm" data-i="' + i + '">✕</span>';
                fileList.appendChild(item);
            });
            fileList.querySelectorAll('.rm').forEach(rm => {
                rm.onclick = () => {
                    selectedFiles.splice(+rm.dataset.i, 1);
                    renderFileList();
                };
            });
        }

        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            selectedFiles = selectedFiles.concat(Array.from(fileInput.files));
            renderFileList();
            fileInput.value = '';
        });
        ['dragover', 'dragenter'].forEach(e => dropzone.addEventListener(e, ev => {
            ev.preventDefault();
            dropzone.classList.add('dragover');
        }));
        ['dragleave', 'drop'].forEach(e => dropzone.addEventListener(e, ev => {
            ev.preventDefault();
            dropzone.classList.remove('dragover');
        }));
        dropzone.addEventListener('drop', ev => {
            const files = Array.from(ev.dataTransfer.files).filter(f => ACCEPT_RE.test(f.name));
            if (!files.length) { showToast('仅支持 pdf/doc/docx/txt/xls/xlsx'); return; }
            selectedFiles = selectedFiles.concat(files);
            renderFileList();
        });

        const uploadBtn = document.getElementById('uploadBtn');
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFiles.length) { showToast('请先选择文件'); return; }
            const fd = new FormData();
            selectedFiles.forEach(f => fd.append('files', f));
            const old = uploadBtn.textContent;
            uploadBtn.disabled = true;
            uploadBtn.textContent = '上传中…';
            try {
                const res = await fetch('http://127.0.0.1:5000/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '上传失败');
                showToast('上传成功：' + (data.count || selectedFiles.length) + ' 个文件');
            } catch (err) {
                showToast('上传失败：' + err.message);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = old;
            }
        });

        const chatBtn = document.getElementById('chatBtn');
        const resultEl = document.getElementById('result');
        chatBtn.addEventListener('click', async () => {
            const project_id = document.getElementById('projectId').value.trim();
            const question = document.getElementById('question').value.trim();
            if (!project_id || !question) { showToast('请填写项目编号和提问'); return; }
            const old = chatBtn.textContent;
            chatBtn.disabled = true;
            chatBtn.textContent = '思考中…';
            resultEl.innerHTML = '<span style="color:#95a5a6">加载中…</span>';
            try {
                const res = await fetch('http://127.0.0.1:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_id, question })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '请求失败');
                resultEl.innerHTML = parseMd(data.markdown || '');
                showToast('回答已生成');
            } catch (err) {
                showToast('请求失败：' + err.message);
                resultEl.innerHTML = '';
            } finally {
                chatBtn.disabled = false;
                chatBtn.textContent = old;
            }
        });
    </script>
</body>
</html>
