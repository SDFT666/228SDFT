<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无恶不作桌小二</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #c2e9fb 100%);
            background-attachment: fixed;
            overflow-x: hidden;
            position: relative;
        }

        .bg-bubble {
            position: fixed;
            border-radius: 50%;
            background: rgba(57, 197, 187, 0.15);
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }
        .bg-bubble:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 8%; animation-delay: 0s; }
        .bg-bubble:nth-child(2) { width: 80px; height: 80px; top: 70%; left: 15%; animation-delay: 2s; background: rgba(255, 182, 193, 0.25); }
        .bg-bubble:nth-child(3) { width: 160px; height: 160px; top: 20%; right: 10%; animation-delay: 4s; background: rgba(135, 206, 235, 0.2); }
        .bg-bubble:nth-child(4) { width: 60px; height: 60px; bottom: 12%; right: 18%; animation-delay: 1s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(420px, 92vw);
            padding: 48px 36px 40px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(44, 62, 80, 0.15), 0 6px 20px rgba(57, 197, 187, 0.2);
            text-align: center;
            animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .avatar-wrap {
            width: 160px;
            height: 160px;
            margin: 0 auto 24px;
            border-radius: 50%;
            padding: 5px;
            background: conic-gradient(from 0deg, #39c5bb, #ff9a9e, #a8edea, #39c5bb);
            animation: spin 6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: linear-gradient(135deg, #39c5bb, #2c3e50);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 64px;
            animation: spin 6s linear infinite reverse;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #2c3e50, #39c5bb, #2c3e50);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .subtitle {
            font-size: 15px;
            color: #7f8c8d;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }
        .subtitle span {
            display: inline-block;
            animation: wave 2s ease-in-out infinite;
        }
        .subtitle span:nth-child(2) { animation-delay: 0.15s; }
        .subtitle span:nth-child(3) { animation-delay: 0.3s; }
        .subtitle span:nth-child(4) { animation-delay: 0.45s; }

        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .btn {
            position: relative;
            padding: 14px 44px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
            background: linear-gradient(135deg, #39c5bb, #2c3e50);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(57, 197, 187, 0.4);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(57, 197, 187, 0.55);
        }
        .btn:active {
            transform: translateY(-1px) scale(0.97);
        }
        .btn::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.5s ease, height 0.5s ease;
        }
        .btn:active::before {
            width: 300px;
            height: 300px;
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            padding: 14px 28px;
            background: linear-gradient(135deg, #2c3e50, #39c5bb);
            color: #fff;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.3);
            z-index: 99;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="bg-bubble"></div>
    <div class="bg-bubble"></div>
    <div class="bg-bubble"></div>
    <div class="bg-bubble"></div>

    <div class="card">
        <div class="avatar-wrap">
            <div class="avatar" id="avatar">
                <img src="images/miku.jpg" alt="桌小二" onerror="this.style.display='none';this.parentNode.textContent='🌸';">
            </div>
        </div>
        <h1>无恶不作桌小二！</h1>
        <p class="subtitle">
            <span>你</span><span>的</span><span>任</span><span>务</span>整理助手 ~~~
        </p>
        <button class="btn" onclick="showToast('你被骗了')">点我</button>
    </div>

    <div class="toast" id="toast">你被骗了</div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }
    </script>
</body>
</html>
